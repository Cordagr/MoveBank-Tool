[package]
name = "mb-tageffect"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
csv = "1"
mb-client = { path = "../mb-client" }
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "1"