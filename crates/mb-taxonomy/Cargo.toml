[package]
name = "mb-taxonomy"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
csv = "1"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
