[package]
name = "mbbrowse"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
mb-client = { path = "../mb-client" }
mb-neglect = { path = "../mb-neglect" }
mb-taxonomy = { path = "../mb-taxonomy" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
